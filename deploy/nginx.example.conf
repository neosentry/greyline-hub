# Two ways to put Greyline Hub on a machine that already runs nginx.
# Use one of them. Paths assume the pages were published to
# /var/www/html/greyline (see publish.directory in config.json).

# 1. Folder mode. Greyline Hub does not listen. nginx serves the files.
#    http://host/greyline/  is the root page, http://host/greyline/map/ the next.
server {
    listen 80;
    server_name radio.home;
    root /var/www/html;

    location /greyline/data/ {
        add_header Cache-Control "no-store";
    }
}

# 2. Reverse proxy to the built-in server on a port you chose.
#    Leave server.base_path empty. The trailing slash makes nginx strip /greyline.
# server {
#     listen 80;
#     server_name radio.home;
#     location /greyline/ {
#         proxy_pass http://127.0.0.1:8754/;
#     }
# }
